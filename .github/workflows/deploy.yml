name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rekapbaris-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:auth
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/rekapbaris?schema=public
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update and restart application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Tambahan opsi StrictHostKeyChecking di bawah ini agar aman dari error key verification
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/RekapBarisWeb
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "VPS worktree has local changes; stopping deployment."
            exit 1
          fi
          umask 077
          backup="$HOME/rekapbaris-$(date +%F-%H%M%S).sql"
          sudo -u postgres pg_dump rekapbaris > "$backup"
          test -s "$backup"
          git pull --ff-only origin main
          npm ci
          npm run db:generate
          npm run db:deploy
          npm run db:seed
          npm run build
          
          # PASTIKAN nama PM2 ini sama persis dengan yang aktif di VPS Anda ('rekapbaris' atau 'RekapBarisWeb')
          pm2 restart rekapbaris --update-env
          
          curl -fsS http://127.0.0.1:3000/api/health
          REMOTE